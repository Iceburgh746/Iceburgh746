name: Build WRCX212 UV-K1 TWEETY TW2 Diagnostic Multiboot

on:
  push:
    paths:
      - '.github/workflows/build-uv-k1-tweety-tw2.yml'
      - 'uv-k1-universal-multiboot/tools/apply_f4hwn_u1.py'
      - 'uv-k1-universal-multiboot/tools/apply_f4hwn_tweety_tw2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout WRCX212 project
        uses: actions/checkout@v4

      - name: Checkout official F4HWN v6.0.0
        uses: actions/checkout@v4
        with:
          repository: armel/uv-k1-k5v3-firmware-custom
          ref: v6.0.0
          path: f4hwn

      - name: Apply U1 Multiboot safety patch
        run: python uv-k1-universal-multiboot/tools/apply_f4hwn_u1.py f4hwn

      - name: Apply TW2 minimal Tweety patch
        run: |
          python uv-k1-universal-multiboot/tools/apply_f4hwn_tweety_tw2.py f4hwn
          cd f4hwn
          git diff --check
          git diff > "$GITHUB_WORKSPACE/WRCX212_TWEETY_TW2_generated.patch"
          test -s "$GITHUB_WORKSPACE/WRCX212_TWEETY_TW2_generated.patch"
          grep -q '"TWEETY"' App/ui/menu.c
          grep -q 'WRCX212 TWEETY TW2' App/driver/bk4829.c
          grep -q 'MB_FLAG_FOREIGN' App/driver/mb_flash.h
          grep -q '"EDITION_STRING": "Fusion"' CMakePresets.json
          grep -q '"VERSION_STRING_2": "v6.0.0"' CMakePresets.json

      - name: Build Fusion-identical Multiboot Tweety firmware
        run: |
          cd f4hwn
          chmod +x compile-firmware.sh
          ./compile-firmware.sh Fusion

      - name: Package and verify TW2 BIN
        run: |
          set -euo pipefail
          SRC="f4hwn/build/Fusion/f4hwn.fusion.bin"
          OUTDIR="dist"
          OUT="$OUTDIR/WRCX212_UVK1_TWEETY_FAST_MULTIBOOT_TW2_DIAGNOSTIC.bin"
          mkdir -p "$OUTDIR"
          test -f "$SRC"
          cp "$SRC" "$OUT"
          cp WRCX212_TWEETY_TW2_generated.patch "$OUTDIR/"
          python - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          p = Path('dist/WRCX212_UVK1_TWEETY_FAST_MULTIBOOT_TW2_DIAGNOSTIC.bin')
          data = p.read_bytes()
          app_base = 0x08002800
          max_size = 0x1D800
          ram_base = 0x20000000
          ram_end = ram_base + 0x4000
          if not data or len(data) > max_size: raise SystemExit(f'INVALID SIZE {len(data)}')
          sp, rv = struct.unpack_from('<II', data, 0)
          rh = rv & ~1
          if not (ram_base <= sp <= ram_end): raise SystemExit(f'bad SP 0x{sp:08X}')
          if not (rv & 1): raise SystemExit(f'bad reset vector 0x{rv:08X}')
          if not (app_base <= rh < app_base + len(data)): raise SystemExit(f'bad reset handler 0x{rh:08X}')
          required = [b'F4HWN MULTIBOOT', b'TWEETY', b'Fusion', b'v6.0.0']
          missing = [x.decode() for x in required if x not in data]
          if missing: raise SystemExit(f'missing strings: {missing}')
          if b'WRCX212 TWEETY\x00' in data or b'v6.0.0-TW1' in data:
              raise SystemExit('TW1 custom identity unexpectedly present')
          sha = hashlib.sha256(data).hexdigest()
          manifest = {
            'file': p.name,
            'source_tag': 'v6.0.0',
            'preset': 'Fusion',
            'project': 'WRCX212 TWEETY TW2 diagnostic',
            'identity': 'stock Fusion / v6.0.0 intentionally preserved',
            'changes': ['Roger menu ROGER -> TWEETY','10-note 238 ms fast Tweety','U1 foreign-slot vector safety'],
            'native_multiboot': True,
            'size_bytes': len(data),
            'max_size_bytes': max_size,
            'free_bytes': max_size-len(data),
            'application_base': f'0x{app_base:08X}',
            'initial_sp': f'0x{sp:08X}',
            'reset_vector': f'0x{rv:08X}',
            'reset_handler': f'0x{rh:08X}',
            'sha256': sha,
            'hardware_validation': 'not yet tested; built specifically to isolate TW1 boot freeze'
          }
          Path('dist/BUILD_MANIFEST_TW2.json').write_text(json.dumps(manifest, indent=2)+'\n')
          Path('dist/SHA256SUMS_TW2.txt').write_text(f'{sha}  {p.name}\n')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish verified TW2 diagnostic firmware
        run: |
          set -euo pipefail
          RELEASE_DIR="uv-k1-universal-multiboot/releases/TW2"
          mkdir -p "$RELEASE_DIR"
          cp dist/WRCX212_UVK1_TWEETY_FAST_MULTIBOOT_TW2_DIAGNOSTIC.bin "$RELEASE_DIR/"
          cp dist/BUILD_MANIFEST_TW2.json "$RELEASE_DIR/"
          cp dist/SHA256SUMS_TW2.txt "$RELEASE_DIR/"
          cp dist/WRCX212_TWEETY_TW2_generated.patch "uv-k1-universal-multiboot/patches/f4hwn-v6.0.0-tweety-tw2-generated.patch"
          git config user.name "WRCX212 Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$RELEASE_DIR" uv-k1-universal-multiboot/patches/f4hwn-v6.0.0-tweety-tw2-generated.patch
          if ! git diff --cached --quiet; then
            git commit -m "Publish TW2 diagnostic native Multiboot Tweety firmware"
            git push
          fi

      - name: Upload TW2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: WRCX212-UVK1-TWEETY-TW2-DIAGNOSTIC
          path: dist/*
          if-no-files-found: error
          retention-days: 90

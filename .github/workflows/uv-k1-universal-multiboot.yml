name: UV-K1 Universal MultiBoot checks

on:
  push:
    paths:
      - 'uv-k1-universal-multiboot/**'
      - '.github/workflows/uv-k1-universal-multiboot.yml'
  pull_request:
    paths:
      - 'uv-k1-universal-multiboot/**'
      - '.github/workflows/uv-k1-universal-multiboot.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          python -m py_compile uv-k1-universal-multiboot/tools/make_slot.py
          python -m py_compile uv-k1-universal-multiboot/tools/upload_slot.py
          python -m py_compile uv-k1-universal-multiboot/tools/apply_f4hwn_u1.py
      - name: Unit tests
        run: python -m unittest discover -s uv-k1-universal-multiboot/tests -v
      - name: Apply U1 modifications to F4HWN v6.0.0 source
        run: |
          git clone --depth 1 --branch v6.0.0 https://github.com/armel/uv-k1-k5v3-firmware-custom.git /tmp/f4hwn
          python "$GITHUB_WORKSPACE/uv-k1-universal-multiboot/tools/apply_f4hwn_u1.py" /tmp/f4hwn
          cd /tmp/f4hwn
          git diff --check
          git diff --exit-code --quiet && { echo 'Patch made no changes'; exit 1; } || true
